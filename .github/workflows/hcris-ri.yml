name: Download Rhode Island cost reports from CMS

# Run by hand from the Actions tab when CMS posts new cost report files (HCRIS). Keeps only Rhode Island homes,
# saved in pipeline/hcris. Nothing on the website changes.

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'CMS file names, separated by spaces (SNF24FY2025 is the new 2540-24 form, SNF10FY2025 the old one)'
        required: true
        default: 'SNF24FY2025 SNF10FY2025 SNF10FY2024'
  push:
    branches: [hcris-ri]
    paths: [.github/scripts/hcris_ri.py, .github/workflows/hcris-ri.yml]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and keep Rhode Island
        env:
          FILES: ${{ inputs.files || 'SNF24FY2025 SNF10FY2025 SNF10FY2024 SNF10FY2023' }}
        run: python3 .github/scripts/hcris_ri.py $FILES
      - name: Save
        run: |
          git config user.name "abc-ri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/hcris
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Rhode Island cost reports from CMS $(date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
