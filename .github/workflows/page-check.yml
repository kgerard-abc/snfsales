name: Temporary page check
on:
  push:
    branches: [cec-page-check]
    paths: [.github/scripts/page_check.py, .github/scripts/page_check.json, .github/workflows/page-check.yml]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && pip install pdfplumber
      - run: python3 .github/scripts/page_check.py
      - run: |
          git config user.name "abc-ri-bot"; git config user.email "actions@users.noreply.github.com"
          git add pipeline/page_check && git commit -m "Page text for checking" && git push origin HEAD:cec-page-check
