name: Temporary - transcribe a Council hearing

# Lives only on the promise-sources branch. Runs when scratch/hearing.txt is pushed there.
# scratch/hearing.txt holds one line: DRIVE_FILE_ID NAME
# Delete the branch when done.

on:
  push:
    branches: [promise-sources]
    paths: ['scratch/hearing.txt', 'scratch/transcribe.py']

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q faster-whisper
      - name: Download the recording from RIDOH's Drive
        run: |
          read ID NAME < scratch/hearing.txt
          curl -sSL -o video "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t"
          ls -la video
          file video
          head -c 200 video | grep -qi '<html' && { echo "Drive returned a web page, not the video"; exit 1; } || true
          ffprobe -hide_banner video 2>&1 | grep -E 'Duration|Stream' | head -5
          ffmpeg -hide_banner -loglevel error -i video -vn -ac 1 -ar 16000 audio.wav
          rm video
          mkdir -p scratch/transcripts
          echo "NAME=$NAME" >> $GITHUB_ENV
      - name: Transcribe
        run: python3 scratch/transcribe.py audio.wav "scratch/transcripts/$NAME"
      - name: Save
        if: always()
        run: |
          git config user.name "abc-ri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scratch/transcripts || true
          git commit -q -m "Hearing transcript: $NAME" || echo nothing
          git pull -q --rebase && git push
