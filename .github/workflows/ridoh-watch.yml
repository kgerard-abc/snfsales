name: Watch RIDOH's list of reviews

# RIDOH's "Annual Report of Reviews" sheet is the source for where each pending application stands.
# This checks it every few hours. When a Change in Effective Control row is added or changed, it saves the new copy
# and starts the sales page rebuild, so the page follows RIDOH without anyone having to ask.
# It also checks the CEC Log tab of the INTERNAL Google Sheet. When a row is added or edited there (by the weekly
# CEC Log check, or by kg filling in a buyer group or principals), it starts the same rebuild.

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: ridoh-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Look for changes
        id: look
        run: python3 .github/scripts/ridoh_watch.py
      - name: Look for CEC Log edits
        id: cec
        run: python3 .github/scripts/cec_log_watch.py
      - name: Look for new documents linked from RIDOH's list
        id: docs
        continue-on-error: true   # a problem reading links must not stop the status watching above
        run: python3 .github/scripts/ridoh_docs.py
      - name: Save the new copies and rebuild the page
        if: (steps.look.outputs.changed == 'true' || steps.cec.outputs.cec_changed == 'true' || steps.docs.outputs.docs_changed == 'true') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "abc-ri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/ridoh_cec_snapshot.json || true
          git add pipeline/cec_log_snapshot.json || true
          git add pipeline/ridoh_cec_docs.json || true
          git commit -m "RIDOH list of reviews, its documents, or the CEC Log changed" || echo "Nothing to commit."
          git pull --rebase origin main
          git push
          REBUILD=no
          if [ "${{ steps.look.outputs.changed }}" = "true" ] && [ "${{ steps.look.outputs.first }}" != "true" ]; then REBUILD=yes; fi
          if [ "${{ steps.cec.outputs.cec_changed }}" = "true" ] && [ "${{ steps.cec.outputs.cec_first }}" != "true" ]; then REBUILD=yes; fi
          if [ "${{ steps.docs.outputs.docs_changed }}" = "true" ]; then REBUILD=yes; fi
          if [ "$REBUILD" = "no" ]; then echo "First run for the changed list: saved the starting copy, no rebuild."; exit 0; fi
          gh workflow run monthly-update.yml --repo "$GITHUB_REPOSITORY" --ref main -f rebuild_only=true -f test_only=false
      - name: Tell kg about new documents
        if: steps.docs.outputs.new_count != '0' && steps.docs.outputs.new_count != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "New RIDOH documents: ${{ steps.docs.outputs.new_cec }} ($(date -u +'%b %-d, %Y'))" \
            --body-file new_docs.md
      - name: Copy new documents to the Internet Archive
        if: steps.docs.outputs.new_ids != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run archive-cec.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=full -f ids="${{ steps.docs.outputs.new_ids }}"
      - name: Not on main
        if: (steps.look.outputs.changed == 'true' || steps.cec.outputs.cec_changed == 'true' || steps.docs.outputs.docs_changed == 'true') && github.ref != 'refs/heads/main'
        run: |
          echo "Test run on a branch: no notice, no archive run, no rebuild. The document list is saved to this branch so the page can be test-built from it."
          if [ -f new_docs.md ]; then echo "----- the notice would read:"; cat new_docs.md; echo "-----"; fi
          echo "Archive would get these ids: ${{ steps.docs.outputs.new_ids }}"
          git config user.name "abc-ri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/ridoh_cec_docs.json || true
          git commit -m "Test: RIDOH documents list" || echo "Nothing to commit."
          git push origin "HEAD:${GITHUB_REF_NAME}"
