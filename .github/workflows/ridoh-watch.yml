name: Watch RIDOH's list of reviews

# RIDOH's "Annual Report of Reviews" sheet is the source for where each pending application stands.
# This checks it every few hours. When a Change in Effective Control row is added or changed, it saves the new copy
# and starts the sales page rebuild, so the page follows RIDOH without anyone having to ask.

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ridoh-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Look for changes
        id: look
        run: python3 .github/scripts/ridoh_watch.py
      - name: Save the new copy and rebuild the page
        if: steps.look.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "abc-ri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/ridoh_cec_snapshot.json
          git commit -m "RIDOH list of reviews changed" || echo "Nothing to commit."
          git pull --rebase origin main
          git push
          if [ "${{ steps.look.outputs.first }}" = "true" ]; then echo "First run: saved the starting copy, no rebuild."; exit 0; fi
          gh workflow run monthly-update.yml --repo "$GITHUB_REPOSITORY" --ref main -f rebuild_only=true -f test_only=false
      - name: Not on main
        if: steps.look.outputs.changed == 'true' && github.ref != 'refs/heads/main'
        run: echo "Test run on a branch - would have saved the copy and rebuilt the page."
