name: Monthly sales page and workbook update

on:
  schedule:
    - cron: '30 12 * * 1'      # every Monday, about 8:30 AM Eastern. Does nothing unless CMS has a new month.
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test run: build everything but do NOT publish (download the result from the run page)'
        type: boolean
        default: true
      force:
        description: 'Add the current CMS month even if it looks already loaded'
        type: boolean
        default: false
      rebuild_only:
        description: 'Skip the CMS download; just rebuild from the saved history and the Google Sheet (use after you edit the Sheet)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # The INTERNAL Google Sheet (must be shared "Anyone with the link can view"). Replace 
  MASTER_SHEET_ID: 1PAgtaNxnLerzBGVojlxgp-yB7N89msak6giJh4Sg6Wk

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Add the newest CMS month to the history
        id: fetch
        run: |
          if [ "${{ inputs.rebuild_only }}" = "true" ]; then echo "new=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ inputs.force }}" = "true" ]; then F="--force"; else F=""; fi
          set -o pipefail
          if python3 pipeline/update_history.py $F 2>&1 | tee fetch.log; then ok=1; else ok=0; fi
          while IFS= read -r line; do echo "::notice::CMS: $line"; done < fetch.log
          if [ "$ok" = "0" ]; then echo "::error::The CMS download step failed (see the notices above)."; exit 1; fi
          if grep -q "NOTHING NEW" fetch.log; then echo "new=no" >> "$GITHUB_OUTPUT"; else echo "new=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Build the page and workbook
        if: steps.fetch.outputs.new == 'yes'
        run: |
          cp index.html pipeline/index.previous.html
          python3 pipeline/build_site.py "$MASTER_SHEET_ID"

      - name: Compare with the live page
        if: steps.fetch.outputs.new == 'yes'
        continue-on-error: true
        run: |
          python3 pipeline/compare_live.py 2>&1 | while IFS= read -r l; do echo "::notice::DIFF: $l"; done

      - name: Safety checks before anything is published
        if: steps.fetch.outputs.new == 'yes'
        run: |
          python3 - <<'PY'
          import json, re, sys
          def D(p):
              t = open(p).read(); return json.loads(re.search(r'<script id="data" type="application/json">(.*?)</script>', t, re.S).group(1))
          old, new = D('pipeline/index.previous.html'), D('index.html')
          bad = []
          if new['meta']['latest'] < old['meta']['latest']: bad.append(f"latest date went backwards: {old['meta']['latest']} to {new['meta']['latest']}")
          if len(new['facilities']) < len(old['facilities']): bad.append(f"facilities dropped from {len(old['facilities'])} to {len(new['facilities'])}")
          dated = [s for s in old['sales'] if s.get('date') and s.get('kind') != 'closed']      # undated sales are no longer listed, and closures are no longer rows in the sales table
          # A sale may leave the table on purpose: an Event Overrides row marks it "not completed" (approved, never closed),
          # "closure" or "not a sale". That is allowed only when the CEC now shows on its home's timeline as such.
          marked = {e.get('cec') for f in new['facilities'] for e in (f.get('events') or []) if e.get('kind') in ('unclosed', 'closed') and e.get('cec')}
          left = [s for s in dated if s.get('cec') and s['cec'] in marked and s['cec'] not in {x.get('cec') for x in new['sales']}]
          if left: print("::notice::Taken out of the sales table on purpose (Event Overrides): " + ", ".join(sorted({s['cec'] for s in left})))
          if len(new['sales']) < len(dated) - len(left): bad.append(f"sales dropped from {len(dated)} to {len(new['sales'])}")
          print(f"::notice::Page now: latest {new['meta']['latest']}, {len(new['facilities'])} facilities, {len(new['sales'])} sales (was: latest {old['meta']['latest']}, {len(old['facilities'])} facilities, {len(old['sales'])} sales)")
          if bad:
              for b in bad: print(f"::error::STOPPED: {b}")
              sys.exit(1)
          PY
          python3 .github/scripts/check_site.py || echo "::warning::Site check reported problems (see log). Known: 9 sales without dates."

      - name: Save the build for download
        if: steps.fetch.outputs.new == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: sales-build
          path: |
            index.html
            pipeline/out/RI_Nursing_Homes_CMS_and_CEC.xlsx

      - name: Publish (commit the new page and history)
        if: steps.fetch.outputs.new == 'yes' && !(github.event_name == 'workflow_dispatch' && inputs.test_only)
        run: |
          rm -f pipeline/index.previous.html
          rm -rf pipeline/out
          git config user.name "abc-ri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html sales.json pipeline/history pipeline/cms_chains.csv
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Monthly CMS update"
          git push
